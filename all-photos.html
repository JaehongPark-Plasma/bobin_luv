.album-heading { padding: 36px 0 24px; }
.album-heading h1 { font-size: clamp(36px, 7vw, 64px); margin: 24px 0 12px; }
.album-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
.album-grid a { padding:8px; border-radius:24px; background:var(--glass-strong); border:1px solid var(--line); box-shadow:var(--shadow); }
.album-grid img { aspect-ratio:3 / 4; object-fit:contain; border-radius:18px; height:auto; }
.album-grid a:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
@media(max-width:680px) { .album-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } }
</style>
